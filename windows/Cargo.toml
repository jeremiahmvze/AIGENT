[package]
name = "aigent"
version = "1.1.0"
edition = "2021"
description = "Run separate signed-in copies of your AI apps side by side."
license = "MIT"

[[bin]]
name = "AIGENT"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = "0.12"
ab_glyph = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "ico"] }
rfd = "0.18"
unicode-segmentation = "1"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "ApplicationModel", "ApplicationModel_Core", "Foundation_Collections", "Management_Deployment",
    "Wdk_System_Threading",
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_EnhancedStorage", "Win32_System_Com",
    "Win32_System_Com_StructuredStorage", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Registry",
    "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell",
    "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
# Build scripts run on the host, so this can't be windows-only when cross-compiling.
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
